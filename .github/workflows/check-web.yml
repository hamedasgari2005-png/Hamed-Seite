name: Check Mooslicht Web
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: TZ=Europe/Berlin npm test
      - run: npx playwright install --with-deps chromium
      - name: Start local app and test actual browser workflows
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/mooslicht-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 0.2
          done
          npm run test:browser
          npm run test:mobile
          npm run test:touch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: test-results/
          retention-days: 1
